<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 2</title>
    <style>
      body {
        font-family: "Source Han Sans", "San Francisco", "PingFang SC", "Hiragino Sans GB", "Droid Sans Fallback", "Microsoft YaHei", sans-serif;
        transition: background-color .2s;
        background-color: #C0C0C0;
      }
      
      .container {
        position: relative;
        top: 0px;
        left: 0px;
        height: 500px;
        right: 500px;
        margin: 0 auto;
        display: block;
        transition: 0.2s;
        overflow: hidden;
        z-index: 0;
      }
      
      .console {
        position: relative;
        top: 5px;
        width: 1150px;
        height: 450px;
        margin-left: 150px;
        margin-bottom: 50px;
        background-color: #262627;
        color: rgb(39, 235, 114);
      }
      .editorTexto{
        position: relative;
        margin-left: 50px;
      }
      
      #Abrir {
        margin-right: 10px;
        margin-left: 10px;
        margin-top: 20px;
      }
      
      #Guardar {
        margin-right: 10px;
        margin-left: 10px;
        margin-top: 20px;
      }
      
      #compilar {
        margin-right: 10px;
        margin-left: 10px;
        margin-top: 20px;
      }
      
      /* Set height of body and the document to 100% to enable "full page tabs" */
      body, html {
        height: 100%;
        margin: 0;
        font-family: Arial;
      }
      
      /* Style tab links */
      .tablink {
        background-color: #06141d60;
        color: white;
        float: left;
        border: none;
        outline: none;
        cursor: pointer;
        padding: 14px 16px;
        font-size: 17px;
        width: 25%;
        margin-left: 0%;
        margin-right: 0%;
      }
      
      .tablink:hover {
        background-color: #06141d60; 
        margin-bottom: 50px;
      }
      
      /* Style the tab content (and add height:100% for full page content) */
      .tabcontent {
        color: white;
        display: none;
        padding: 100px 20px;
        height: 100%;
        margin-left: 0%;
        margin-right: 5%;
      }      
    </style>
</head>
<body class="body">
    <nav class="navbar navbar-expand-lg navbar-light" style="background-color: #06141d60;">
        <div class="container-fluid">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            </ul>
        </div>
    </nav>
    <div class="col-auto">
        <br>
        <div class="row justify-content-end">
            <div class="col-3">
                <input class="btn btn-outline-info" type="file" id="Abrir" />
                <button class="btn btn-outline-warning btn-lg" onclick="compilar()">Ejecutar</button>
                <button class="btn btn-outline-primary btn-lg" onclick="redirectToLoginPage()">Iniciar sesión</button> <!-- Botón de inicio de sesión -->
            </div>
        </div>
        <div>
            <br><br>
          <div class="form-floating">
            <textarea class="editorTexto" id="floatingTextarea2" name="floatingTextarea2" rows="15" cols="150" style="resize: none;"></textarea>
        </div>
        
        </div>
        <br>
        
        <br>
        <div class="consola">
            <div class="form-floating">
                <textarea class="console" id="consola" style="resize: none;"></textarea>
            </div>
        </div>
        <br><br>
        <button class="tablink" onclick="openPage('TablaSim')">Tabla de Simbolos</button>
        <button class="tablink" onclick="openPage('AST')">AST</button>
        <button class="tablink" onclick="openPage('Errores')">Reporte Errores</button>
        <div id="TablaSim" class="tabcontent" style="background-color: #06141d60;">
            <table class="table table-striped table-dark" id="tablasimbols" style="width:100%" bordered="true">
            </table>
        </div>
        <div id="AST" class="tabcontent" style="background-color: #06141d60;">
            <div id="graph" style="text-align: center;"></div>
        </div>
        <div id="Errores" class="tabcontent" style="background-color: #06141d60;">
            <table class="table table-striped table-dark" id="tabError" style="width:100%" bordered="true">
            </table>
        </div>
        <br><br>
    </div>
    <script src="./app.js"></script>
    <script src="node_modules/codemirror/lib/codemirror.js"></script> 
    <script src="node_modules/codemirror/mode/javascript/javascript.js"></script>
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="https://unpkg.com/@hpcc-js/wasm@0.3.11/dist/index.min.js"></script>
    <script src="https://unpkg.com/d3-graphviz@3.0.5/build/d3-graphviz.js"></script>
    <script>
        var editor = CodeMirror.fromTextArea(document.getElementById("floatingTextarea2"), {
            lineNumbers: true,  
            styleActiveLine: true,  
            matchBrackets: true,
            theme: "darcula",
        });
        editor.setValue(``);
    </script>
</body>
</html>
